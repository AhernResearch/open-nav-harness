name: checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install uv==0.9.27
      - run: uv sync --locked --extra dev
      - run: uv run pytest -q
      - run: uv run ruff check nav_harness
      - run: uv run ruff check --select F821,F823 navgpt
      - run: uv run mypy nav_harness
      - run: npm --prefix frontend ci
      - run: uv run nav-harness --state /tmp/navh-schema openapi > frontend/openapi.json
      - run: npm --prefix frontend run build
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm --prefix frontend test
      - run: uv build
